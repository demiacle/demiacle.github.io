    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" as="image" href="/media/test.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400&display=swap"
    />

    <meta
      name="description"
      content="Daniel Escobedo (Demiacle), full stack developer. Portfolio of web apps, games and mods."
    />
    <link rel="canonical" href="https://demiacle.github.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://demiacle.github.io/" />
    <meta property="og:title" content="Daniel Escobedo | Demiacle" />
    <meta
      property="og:description"
      content="Full stack developer. Portfolio of web apps, games and mods."
    />
    <meta property="og:image" content="https://demiacle.github.io/media/headshot.jpg" />
    <meta name="twitter:card" content="summary" />
    <style>
      /* Critical styles: paint the theme color immediately (no white flash)
         and show a small loader until React replaces #root's contents. */
      html,
      body {
        margin: 0;
        background-color: #022834;
      }
      .boot {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          1.125rem/1 Menlo,
          Monaco,
          Consolas,
          'Courier New',
          monospace;
        color: #6a7696;
        opacity: 0;
        /* Delayed so fast loads never flash the loader. */
        animation: boot-in 0.3s ease 0.3s forwards;
      }
      .boot span {
        color: #fc9354;
        animation: boot-blink 1s steps(1) infinite;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-blink {
        50% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">{&nbsp;<span>loading</span>&nbsp;}</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
